<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family={{ display_font }}:wght@700;800&family={{ body_font }}:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--accent:{{ accent }};--accent2:{{ accent_2 }};--text:{{ text }};--muted:{{ muted }}}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:{{ w }}px;height:{{ h }}px;overflow:hidden}
  body{
    background:
      radial-gradient(900px 700px at 78% 18%, color-mix(in srgb, var(--accent) 32%, transparent), transparent 60%),
      radial-gradient(800px 800px at 16% 86%, color-mix(in srgb, var(--accent2) 26%, transparent), transparent 60%),
      linear-gradient(160deg,#0a0d14 0%, #05070c 100%);
    color:var(--text);font-family:'{{ body_font }}',sans-serif;position:relative}
  /* faint grid texture */
  body::before{content:"";position:absolute;inset:0;opacity:.05;
    background-image:linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.7) 1px,transparent 1px);
    background-size:120px 120px}
  .center{position:absolute;left:0;right:0;top:42%;transform:translateY(-50%);
    display:flex;flex-direction:column;align-items:center;text-align:center;z-index:3;padding:0 60px}
  .logo{width:230px;height:230px;border-radius:50%;object-fit:cover;
    box-shadow:0 24px 70px color-mix(in srgb, var(--accent) 45%, transparent);margin-bottom:44px}
  .brand{font-family:'{{ display_font }}';font-weight:800;font-size:118px;letter-spacing:-1px;line-height:1.02}
  .sub{color:var(--muted);font-size:46px;font-weight:500;margin-top:18px;letter-spacing:.5px}
  .btn{position:absolute;left:50%;top:74%;transform:translateX(-50%);z-index:3;
    background:linear-gradient(120deg,var(--accent),var(--accent2));color:#0a0a0a;
    font-family:'{{ display_font }}';font-weight:800;font-size:54px;
    padding:32px 80px;border-radius:18px;white-space:nowrap;
    box-shadow:0 22px 60px color-mix(in srgb, var(--accent) 40%, transparent)}
</style>
</head>
<body>
  <div class="center">
    {% if logo_data %}<img class="logo" src="{{ logo_data }}" alt="">{% endif %}
    <div class="brand">{{ name }}</div>
    {% if tagline %}<div class="sub">{{ tagline }}</div>{% endif %}
  </div>
  <div class="btn">{{ url if url else "Follow for more" }}</div>
</body>
</html>
